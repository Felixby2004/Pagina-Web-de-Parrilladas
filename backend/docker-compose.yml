version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: parrilladas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parrilladas_user
      POSTGRES_PASSWORD: parrilladas_pass
      POSTGRES_DB: parrilladas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parrilladas_user -d parrilladas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: